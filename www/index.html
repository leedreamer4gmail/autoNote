<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>autoNote</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f4f6f8;color:#1f2933;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,textarea{font:inherit}
.shell{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
.side{border-right:1px solid #d8dee4;background:#ffffff;display:flex;flex-direction:column;min-width:0}
.brand{height:68px;padding:14px 16px;border-bottom:1px solid #d8dee4;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:20px;letter-spacing:0;font-weight:750;color:#152238}
.count{font-size:12px;color:#697386;white-space:nowrap}
.search{padding:12px;border-bottom:1px solid #e5e9ef;display:flex;gap:8px}
.search input,.meta input{width:100%;height:36px;border:1px solid #cfd7df;border-radius:6px;padding:0 10px;background:#fff;color:#1f2933;outline:none}
.search input:focus,.meta input:focus,textarea:focus{border-color:#2f6b4f;box-shadow:0 0 0 3px rgba(47,107,79,.12)}
.note-list{flex:1;overflow:auto;padding:8px}
.note-item{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:10px 9px;text-align:left;cursor:pointer;color:#1f2933;display:block;min-height:62px}
.note-item:hover{background:#eef3f6}
.note-item.active{border-color:#2f6b4f;background:#edf6f1}
.note-title{display:block;font-weight:650;font-size:14px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-meta{display:flex;gap:8px;margin-top:6px;color:#697386;font-size:12px;align-items:center;min-width:0}
.note-meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:22px 12px;color:#697386;font-size:14px;text-align:center}
.main{display:flex;flex-direction:column;min-width:0;min-height:100vh}
.bar{height:68px;border-bottom:1px solid #d8dee4;background:#ffffff;display:flex;align-items:center;gap:10px;padding:12px 16px;min-width:0}
.bar .spacer{flex:1}
.btn{height:36px;border:1px solid #cfd7df;border-radius:6px;background:#fff;color:#253242;padding:0 13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#2f6b4f;color:#2f6b4f;background:#f8fbf9}
.btn.primary{background:#2f6b4f;border-color:#2f6b4f;color:#fff}
.btn.primary:hover{background:#25583f;color:#fff}
.btn.warn:hover{border-color:#c45a3d;color:#a2432e;background:#fff7f4}
.meta{display:grid;grid-template-columns:minmax(120px,180px) minmax(160px,240px);gap:10px;padding:12px 16px;border-bottom:1px solid #e5e9ef;background:#fbfcfd}
.editor-wrap{flex:1;display:flex;min-height:0;padding:16px;background:#f4f6f8}
textarea{width:100%;min-height:0;resize:none;border:1px solid #cfd7df;border-radius:8px;background:#fff;color:#16202a;padding:18px;font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:15px;line-height:1.65;outline:none}
.status{min-height:38px;border-top:1px solid #d8dee4;background:#fff;padding:10px 16px;color:#697386;font-size:13px;white-space:pre-wrap}
.status.ok{color:#276749}.status.err{color:#b42318}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:34vh;border-right:none;border-bottom:1px solid #d8dee4}.main{min-height:66vh}.meta{grid-template-columns:1fr}.bar{gap:8px;overflow-x:auto}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <h1>autoNote</h1>
      <span class="count" id="count">0 条</span>
    </div>
    <div class="search">
      <input id="query" placeholder="搜索" autocomplete="off">
      <button class="btn" id="refreshBtn" title="刷新">刷新</button>
    </div>
    <div class="note-list" id="noteList"></div>
  </aside>

  <main class="main">
    <div class="bar">
      <button class="btn" id="newBtn" title="新建">新建</button>
      <button class="btn primary" id="lucyBtn" title="让 Lucy 判断合并或新建">Lucy</button>
      <button class="btn primary" id="saveBtn" title="保存当前笔记">保存</button>
      <span class="spacer"></span>
      <a class="btn" href="/autonote/manual.html">上传</a>
      <a class="btn" href="/autonote/gethb" target="_blank">手册</a>
      <button class="btn warn" id="disableBtn" title="失效当前笔记">失效</button>
      <button class="btn warn" id="deleteBtn" title="删除当前笔记">删除</button>
    </div>
    <div class="meta">
      <input id="folder" placeholder="文件夹" autocomplete="off">
      <input id="tags" placeholder="标签，用逗号分隔" autocomplete="off">
    </div>
    <div class="editor-wrap">
      <textarea id="editor" placeholder="# 经验标题&#10;- 版本：1.0.0&#10;- 2026-05-08：Copilot - 新增记录&#10;&#10;## 场景&#10;"></textarea>
    </div>
    <div class="status" id="status">就绪</div>
  </main>
</div>

<script>
const API_KEY = '__API_KEY__';
const USER = 'leedreamer';
let currentId = null;
let notes = [];

const noteList = document.getElementById('noteList');
const countEl = document.getElementById('count');
const queryEl = document.getElementById('query');
const editor = document.getElementById('editor');
const folderEl = document.getElementById('folder');
const tagsEl = document.getElementById('tags');
const statusEl = document.getElementById('status');

function setStatus(text, type) {
  statusEl.textContent = text;
  statusEl.className = 'status ' + (type || '');
}

async function api(path, options = {}) {
  const headers = Object.assign({'X-Api-Key': API_KEY}, options.headers || {});
  const resp = await fetch(path, Object.assign({}, options, {headers}));
  const ct = resp.headers.get('content-type') || '';
  if (!ct.includes('application/json')) {
    throw new Error('服务暂时不可用，请稍后刷新（' + resp.status + '）');
  }
  return resp;
}

function tagsFromInput() {
  return tagsEl.value.split(/[,，\s]+/).map(x => x.trim()).filter(Boolean).slice(0, 5);
}

function renderList() {
  countEl.textContent = notes.length + ' 条';
  if (!notes.length) {
    noteList.innerHTML = '<div class="empty">暂无笔记</div>';
    return;
  }
  noteList.innerHTML = notes.map(note => `
    <button class="note-item ${note.id === currentId ? 'active' : ''}" data-id="${note.id}">
      <span class="note-title">${escapeHtml(note.title || '未命名笔记')}</span>
      <span class="note-meta"><span>${escapeHtml(note.folder || '默认')}</span><span>${escapeHtml((note.tags || []).join(' '))}</span></span>
    </button>
  `).join('');
  noteList.querySelectorAll('.note-item').forEach(btn => {
    btn.addEventListener('click', () => loadNote(btn.dataset.id));
  });
}

async function loadNotes() {
  const q = encodeURIComponent(queryEl.value.trim());
  const resp = await api(`/autonote/notetools/notes?user=${encodeURIComponent(USER)}&q=${q}`);
  const data = await resp.json();
  if (!data.ok) throw new Error(data.error || '读取列表失败');
  notes = data.notes || [];
  renderList();
}

async function loadNote(id) {
  const resp = await api('/autonote/notetools/notes/' + encodeURIComponent(id));
  const data = await resp.json();
  if (!data.ok) throw new Error(data.error || '读取笔记失败');
  const note = data.note;
  currentId = note.id;
  editor.value = note.content || '';
  folderEl.value = note.folder || '';
  tagsEl.value = (note.tags || []).join(', ');
  renderList();
  setStatus('已打开：' + (note.title || note.id), 'ok');
}

function newNote() {
  currentId = null;
  editor.value = '';
  folderEl.value = '';
  tagsEl.value = '';
  renderList();
  editor.focus();
  setStatus('新笔记', '');
}

async function saveNote() {
  const content = editor.value.trim();
  if (!content) return setStatus('内容为空', 'err');
  const payload = {user: USER, content, folder: folderEl.value.trim(), tags: tagsFromInput()};
  const path = currentId ? '/autonote/notetools/update' : '/autonote/notetools/new';
  if (currentId) payload.id = currentId;
  const resp = await api(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  const data = await resp.json();
  if (!data.ok) throw new Error(data.error || '保存失败');
  currentId = data.id;
  await loadNotes();
  setStatus('已保存：' + (data.note && data.note.title ? data.note.title : currentId), 'ok');
}

async function lucySave() {
  const text = editor.value.trim();
  if (!text) return setStatus('内容为空', 'err');
  const resp = await api('/autonote/lucy/intake', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({user: USER, text, folder: folderEl.value.trim(), tags: tagsFromInput(), author: 'Lucy'})
  });
  const data = await resp.json();
  if (!data.ok) throw new Error(data.error || 'Lucy 保存失败');
  currentId = data.id;
  await loadNotes();
  await loadNote(currentId);
  setStatus(data.action === 'update' ? 'Lucy 已合并到旧笔记' : 'Lucy 已新建笔记', 'ok');
}

async function disableNote() {
  if (!currentId) return setStatus('没有打开的笔记', 'err');
  const resp = await api('/autonote/notetools/unable', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: currentId})
  });
  const data = await resp.json();
  if (!data.ok) throw new Error(data.error || '失效失败');
  newNote();
  await loadNotes();
  setStatus('已失效', 'ok');
}

async function deleteNote() {
  if (!currentId) return setStatus('没有打开的笔记', 'err');
  if (!confirm('删除当前笔记？')) return;
  const resp = await api('/autonote/notetools/del', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: currentId})
  });
  const data = await resp.json();
  if (!data.ok) throw new Error(data.error || '删除失败');
  newNote();
  await loadNotes();
  setStatus('已删除', 'ok');
}

function run(task) {
  return async function() {
    try { await task(); }
    catch (err) { setStatus(err.message, 'err'); }
  };
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text == null ? '' : String(text);
  return div.innerHTML;
}

document.getElementById('refreshBtn').addEventListener('click', run(loadNotes));
document.getElementById('newBtn').addEventListener('click', newNote);
document.getElementById('saveBtn').addEventListener('click', run(saveNote));
document.getElementById('lucyBtn').addEventListener('click', run(lucySave));
document.getElementById('disableBtn').addEventListener('click', run(disableNote));
document.getElementById('deleteBtn').addEventListener('click', run(deleteNote));
queryEl.addEventListener('input', () => window.clearTimeout(queryEl._timer) || (queryEl._timer = window.setTimeout(run(loadNotes), 250)));
editor.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    run(saveNote)();
  }
});

run(loadNotes)();
</script>
</body>
</html>
